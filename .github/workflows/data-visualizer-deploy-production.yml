name: "Data Visualizer Deploy: Production"

# Builds the given commit, migrates the prod DB, deploys to production, and
# promotes the deployment so that it serves the production domains.
# Runs in the "production" environment, which requires approval.
#
# The build runs before the migration, so a broken build never touches the prod
# DB.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit or branch to deploy (should already be on staging)"
        required: true
        default: main

concurrency:
  group: data-visualizer-deploy-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
        working-directory: software
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy" # required by Prisma during postinstall
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Migrate prod DB
        run: npx prisma migrate deploy
        working-directory: software/data-visualizer
        env:
          DATABASE_URL: ${{ secrets.PROD_DIRECT_URL }}
      - name: Deploy production
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Promote to production
        # Production domains may not be auto-assigned to new production deployments
        # so explicitly promote the deployment
        run: vercel promote ${{ steps.deploy.outputs.url }} --yes --scope=$VERCEL_ORG_ID --token=${{ secrets.VERCEL_TOKEN }}
      - run: |
          echo "### Production" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed ${{ steps.deploy.outputs.url }} (commit $(git rev-parse HEAD)) to production" >> "$GITHUB_STEP_SUMMARY"
