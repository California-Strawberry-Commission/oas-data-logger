name: Firmware Tests

# Runs on push to main and on all PRs, so that "test" can be a required check.
# "test" and "build" are skipped (which counts as passing) when no firmware code
# has changed.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      firmware: ${{ steps.filter.outputs.firmware }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            firmware:
              - "software/oas-logger/**"
              - "software/dlflib/**"
              - ".github/workflows/firmware-tests.yml"

  test:
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio
      - name: Test dlflib
        run: pio test -e native-test
        working-directory: software/dlflib
      - name: Test oas-logger
        run: pio test -e native-test
        working-directory: software/oas-logger

  build:
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [v1-app, v1-factory, v0-app, v0-factory]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio
      - name: Build PlatformIO Projects
        run: pio run -e ${{ matrix.environment }}
        working-directory: software/oas-logger
