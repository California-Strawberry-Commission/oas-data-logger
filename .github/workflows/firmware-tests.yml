name: Firmware Tests

on: # Run on push to main branch, as well as all PRs, when firmware code changes
  push:
    branches: [main]
    paths:
      - "software/oas-logger/**"
      - "software/dlflib/**"
      - ".github/workflows/firmware-tests.yml"
  pull_request:
    paths:
      - "software/oas-logger/**"
      - "software/dlflib/**"
      - ".github/workflows/firmware-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio
      - name: Test dlflib
        run: pio test -e native-test
        working-directory: software/dlflib
      - name: Test oas-logger
        run: pio test -e native-test
        working-directory: software/oas-logger

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [v1-app, v1-factory, v0-app, v0-factory]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio
      - name: Build PlatformIO Projects
        run: pio run -e ${{ matrix.environment }}
        working-directory: software/oas-logger
