name: Server Tests

on: # Run on push to main branch, as well as all PRs, when server code changes
  push:
    branches: [main]
    paths:
      - "software/data-visualizer/**"
      - "software/dlflib-js/**"
      - "software/package.json"
      - "software/package-lock.json"
      - ".github/workflows/server-tests.yml"
  pull_request:
    paths:
      - "software/data-visualizer/**"
      - "software/dlflib-js/**"
      - "software/package.json"
      - "software/package-lock.json"
      - ".github/workflows/server-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install
        working-directory: software
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy" # required by Prisma during postinstall
      - run: npm test
        working-directory: software
