name: Server Tests

# Runs on push to main and on all PRs, so that "test" can be a required check.
# "test" is skipped (which counts as passing) when no server code has changed.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - "software/data-visualizer/**"
              - "software/dlflib-js/**"
              - "software/package.json"
              - "software/package-lock.json"
              - ".github/workflows/server-tests.yml"

  test:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install
        working-directory: software
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy" # required by Prisma during postinstall
      - run: npm test
        working-directory: software
